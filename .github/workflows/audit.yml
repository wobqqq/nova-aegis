name: Security audit

# composer audit and npm audit also run in CI on every change; run this by hand from
# the Actions tab to check the locked dependencies between changes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Composer and npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Audit the locked PHP dependencies
        run: composer audit --locked --abandoned=report

      - name: Audit the locked JS dependencies
        run: npm audit --package-lock-only --audit-level=moderate
